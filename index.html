  .legend {

  }
  .legend-item {
    display: flex; align-items: center; gap: 6px; font-size: 12.5px;
    background: rgba(255,255,255,0.14); padding: 4px 10px 4px 6px; border-radius: 999px;
    border: 1.5px solid transparent; color: #fff; cursor: pointer; font-family: inherit;
    transition: background 0.12s, opacity 0.12s;
  }
  .legend-item:hover { background: rgba(255,255,255,0.24); }
  .legend-item.active { background: rgba(255,255,255,0.92); color: #2E2E38; border-color: #fff; font-weight: 600; }
  .legend-item.dimmed { opacity: 0.45; }
  .legend-clear {
    font-size: 11.5px; color: rgba(255,255,255,0.85); text-decoration: underline; cursor: pointer;
    background: none; border: none; padding: 4px 2px; font-family: inherit;
  }
  .legend-clear:hover { color: #fff; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .cal-wrap {
    max-height: calc(100vh - 118px);
    overflow: auto;
    padding: 0 14px 20px 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(150px, 1fr));
    border-left: 1px solid var(--border);
    border-top: 1px solid var(--border);
    min-width: 1050px;
  }
  .wd {
    position: sticky; top: 0; z-index: 5;
    background: #2E2E38; color: #fff;
    padding: 8px 10px; font-size: 12.5px; font-weight: 600;
    border-right: 1px solid rgba(255,255,255,0.12);
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  .day {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--card);
    min-height: 230px;
    max-height: 340px;
    display: flex; flex-direction: column;
    position: relative;
  }
  .day.empty { background: #FAFAFB; }
  .day-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 8px 2px 8px; flex: none;
  }
  .day-num { font-size: 14px; font-weight: 700; color: var(--ink); }
  .day-num.month-start { color: #A8324A; }
  .day-month-label { font-size: 10.5px; color: var(--muted); }
  .day-count { font-size: 10px; color: var(--muted); }
  .events {
    flex: 1 1 auto; overflow-y: auto; padding: 2px 6px 4px 6px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .ev {
    position: relative;
    background: #F4F5F7;
    border-radius: 5px;
    padding: 3px 18px 3px 7px;
    font-size: 10.6px;
    line-height: 1.32;
    cursor: pointer;
    border-left: 4px solid #999;
  }
  .ev:hover { background: #ECEEF1; }
  .ev .t { font-weight: 700; margin-right: 3px; }
  .ev .who { display: block; font-size: 9px; color: var(--muted); margin-top: 1px; }
  .ev .del {
    position: absolute; top: 1px; right: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: transparent; border: none; color: #B0B4BB;
    font-size: 12px; line-height: 15px; text-align: center; cursor: pointer;
    padding: 0;
  }
  .ev .del:hover { background: #E7495022; color: #E74950; }
  .gender-head {
    font-size: 9.5px; font-weight: 700; color: #8A8F98; text-transform: uppercase;

  .gender-head:first-child { border-top: none; margin-top: 0; }
  .add-btn {
    flex: none; margin: 3px 6px 6px 6px;
    border: 1px dashed #C7CBD1; background: transparent; color: var(--muted);
    border-radius: 5px; font-size: 11px; padding: 3px 0; cursor: pointer;
  }
  .add-btn:hover { border-color: #7A1F2B; color: #7A1F2B; background: #7A1F2B0d; }

  .overlay {

    align-items: center; justify-content: center; z-index: 50;

  .overlay.show { display: flex; }
  .modal {

  .btn { padding: 6px 14px; border-radius: 6px; font-size: 12.5px; cursor: pointer; border: 1px solid var(--border); background: #fff; }

  .cfg-banner {

async function storageGet(key) {
  if (HAS_CLAUDE_STORAGE) {
    try { return await window.storage.get(key, true); }
    catch (err) { /* fall through to localStorage */ }
  }
  try {
    const v = window.localStorage.getItem(key);
    return v ? { value: v } : null;
  } catch (err) { return null; }
}
async function storageSet(key, value) {
  if (HAS_CLAUDE_STORAGE) {
    try { await window.storage.set(key, value, true); return true; }
    catch (err) { /* fall through to localStorage */ }
  }
  try { window.localStorage.setItem(key, value); return true; }
  catch (err) { return false; }
}

async function fetchExternalSchedule() {
  const res = await fetch(EXTERNAL_SOURCE_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const extracted = new Function(text + '\nreturn { EVENTS: EVENTS, ROSTER: ROSTER };')();
  return extracted;
}

function buildExternalLookup(EXTERNAL_EVENTS) {
  const rows = [];
  EXTERNAL_EVENTS.forEach(row => {
    if (!row.hkg) return;
    (row.sessions || []).forEach(s => {
      let evZh = translateEventJS(s.name);
      if (s.opp && OPP_CODE2NAME[s.opp]) {
        evZh += `（對手：${OPP_CODE2NAME[s.opp]}）`;
      }
      rows.push({
        date: s.date, time: (s.start || '').slice(0, 5),
        discipline: row.event, event: evZh, venue: s.venue || row.venue || '',
        opp: s.opp || null,
      });
    });
  });
  return rows;
}

async function runExternalSync(isManual) {
  const msg = document.getElementById('statusMsg');
  try {
    const { EVENTS: extEvents } = await fetchExternalSchedule();
    const extLookup = buildExternalLookup(extEvents);
    SCHEDULE_LOOKUP = extLookup.concat(SCHEDULE_LOOKUP);

    let changed = 0;
    events.forEach(e => {
      const match = findScheduleMatchIn(extLookup, e.date, e.discipline, e.event);
      if (!match) return;
      let touched = false;
      if (match.time && match.time !== e.time) { e.time = match.time; touched = true; }
      if (match.venue && match.venue !== e.venue) { e.venue = match.venue; touched = true; }
      if (touched) changed++;
    });

    externalSyncState = 'ok';
    setConnPill(HAS_SUPABASE_CFG ? 'supabase' : (HAS_CLAUDE_STORAGE ? 'claude' : 'local'), true);
    if (isManual || changed > 0) {
      msg.style.color = '#1E8E4E';
      msg.textContent = `外部賽程已同步（reiko-nik/2026NagoyaAG）— 更新了 ${changed} 項時間／場地`;
    }
    if (changed > 0) renderGrid();
  } catch (err) {
    externalSyncState = 'failed';
    setConnPill(HAS_SUPABASE_CFG ? 'supabase' : (HAS_CLAUDE_STORAGE ? 'claude' : 'local'), false);
    if (isManual) {
      msg.style.color = '#B0234A';
      msg.textContent = '無法連接外部賽程來源，繼續使用內置資料：' + err.message;
    }
  }
}

// Try to find a matching row in the full schedule reference for a manually
// typed event, so time/venue can be auto-filled without the person having to
// look it up. Matches on same date + loose two-way substring overlap on
// discipline and event text (Chinese has no clean word-boundary tokenizer,
// so containment is the most robust simple heuristic here).
function norm(s) { return (s || '').replace(/[\s\-–—()（）,，、·]+/g, '').toLowerCase(); }
function looseMatch(a, b) {
  a = norm(a); b = norm(b);
  if (!a || !b) return false;
  return a.includes(b) || b.includes(a);
}
function findScheduleMatch(date, discipline, eventText) {
  return findScheduleMatchIn(SCHEDULE_LOOKUP, date, discipline, eventText);
}
function findScheduleMatchIn(lookup, date, discipline, eventText) {
  const candidates = lookup.filter(r => r.date === date);
  if (candidates.length === 0) return null;
  const scored = [];
  candidates.forEach(r => {
    const discOk = !discipline || looseMatch(r.discipline, discipline);
    const evOk = eventText && looseMatch(r.event, eventText);
    if (discOk && evOk) {
      const overlap = Math.min(norm(r.event).length, norm(eventText).length);
      scored.push({ row: r, score: overlap });
    }
  });
  if (scored.length === 0) return null;
  scored.sort((a, b) => b.score - a.score);
  if (scored.length > 1 && scored[0].score === scored[1].score) return null;
  return scored[0].row;
}

  // Ambiguous if the top two candidates tie exactly on specificity — better to
  // leave it blank than guess wrong.
  if (scored.length > 1 && scored[0].score === scored[1].score) return null;
  return scored[0].row;
}

  el.innerHTML = base;
}
  
function fmtDayLabel(iso) {
  const d = new Date(iso + 'T00:00:00');
  const m = d.getMonth() + 1, day = d.getDate();
  const showMonth = (day === 1) || (iso === DAYS[0]);
  const isMonthStart = (day === 1);
  return { m, day, showMonth, isMonthStart };
}

const WD_ZH = ['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  WD_ZH.forEach(w => {
    const hd = document.createElement('div');
    hd.className = 'wd';
    hd.textContent = w;
    grid.appendChild(hd);
  });

  const byDate = {};
  const visibleEvents = activeFilter.size > 0
    ? events.filter(e => e.people.some(p => activeFilter.has(p)))
    : events;
  visibleEvents.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  Object.values(byDate).forEach(list => list.sort((a, b) => (a.time || '').localeCompare(b.time || '')));

  DAYS.forEach((iso, idx) => {
    const cell = document.createElement('div');
    cell.className = 'day';
    const { m, day, showMonth, isMonthStart } = fmtDayLabel(iso);
    const head = document.createElement('div');
    head.className = 'day-head';
    const list = byDate[iso] || [];
    head.innerHTML = `<span class="day-num ${isMonthStart ? 'month-start' : ''}">${showMonth ? (m+'/'+day) : day}</span><span class="day-count">${list.length ? list.length + ' 項' : ''}</span>`;
    cell.appendChild(head);

    const evWrap = document.createElement('div');
    evWrap.className = 'events';
    list.forEach(e => evWrap.appendChild(renderEventCard(e)));
    cell.appendChild(evWrap);

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.textContent = '＋ 新增項目';
    addBtn.onclick = () => openModal(iso);
    cell.appendChild(addBtn);

    grid.appendChild(cell);
  });
}

function renderEventCard(e) {
  const div = document.createElement('div');
  div.className = 'ev';
  const colors = e.people.map(personColor);
  if (colors.length === 1) {
    div.style.borderLeftColor = colors[0];
  } else {
    div.style.borderImage = `linear-gradient(${colors.join(',')}) 1`;
    div.style.borderLeftWidth = '4px';
    div.style.borderLeftStyle = 'solid';
  }
  const who = e.people.map(p => PEOPLE[p] ? PEOPLE[p].label_zh.replace(/（.*）/, '') : p).join(' / ');
  const athleteBit = e.athletes ? `　${e.athletes}` : '';
  div.innerHTML = `<span class="t">${e.time || ''}</span>${e.discipline} － ${e.event}${athleteBit}<span class="who">${who}${e.venue ? '　·　' + e.venue : ''}</span>
    <button class="del" title="刪除">×</button>`;
  div.title = `${e.discipline} ${e.event}\n${e.venue || ''}`;
  div.addEventListener('click', () => openModal(e.date, e));
  div.querySelector('.del').onclick = (ev) => { ev.stopPropagation(); deleteEvent(e.id); };
  return div;
}

function openModal(iso, existing) {
  document.getElementById('modalTitle').textContent = existing ? '編輯採訪項目' : '新增採訪項目';
  document.getElementById('editId').value = existing ? existing.id : '';
  document.getElementById('fDate').value = iso;
  document.getElementById('fTime').value = existing ? existing.time : '';
  document.getElementById('fDiscipline').value = existing ? existing.discipline : '';
  document.getElementById('fEvent').value = existing ? existing.event : '';
  document.getElementById('fAthletes').value = existing ? existing.athletes : '';
  const pc = document.getElementById('peopleCheck');
  pc.innerHTML = Object.keys(PEOPLE).map(p => {
    const checked = existing ? existing.people.includes(p) : (activeFilter.size === 1 && activeFilter.has(p));
    return `<label><input type="checkbox" value="${p}" ${checked ? 'checked' : ''}> <span style="color:${PEOPLE[p].color}">●</span> ${p}</label>`;
  }).join('');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlay').dataset.date = iso;
}
function closeModal() { document.getElementById('overlay').classList.remove('show'); }

async function saveModal() {
  const iso = document.getElementById('fDate').value;
  const id = document.getElementById('editId').value;
  const people = Array.from(document.querySelectorAll('#peopleCheck input:checked')).map(i => i.value);
  if (people.length === 0) { alert('請至少選擇一位負責同事'); return; }
  let time = document.getElementById('fTime').value.trim();
  const discipline = document.getElementById('fDiscipline').value.trim() || '（未命名項目）';
  const eventText = document.getElementById('fEvent').value.trim();
  let venue = '';
  let autoFilled = false;

  // If time and/or venue were left blank, try to auto-fill from the full
  // schedule reference by matching date + discipline + event text.
  if (!time || !venue) {
    const match = findScheduleMatch(iso, discipline, eventText);
    if (match) {
      if (!time && match.time) { time = match.time; autoFilled = true; }
      if (!venue && match.venue) { venue = match.venue; autoFilled = true; }
    }
  }

  const payload = {
    id: id || (HAS_SUPABASE_CFG ? crypto.randomUUID() : ('u' + (seq++))),
    date: iso,
    time,
    discipline,
    event: eventText,
    athletes: document.getElementById('fAthletes').value.trim(),
    venue,
    people,
  };

  if (HAS_SUPABASE_CFG) {
    const msg = document.getElementById('statusMsg');
    const { error } = await sb.from(SUPABASE_TABLE).upsert(toDbRow(payload), { onConflict: 'id' });
    if (error) { msg.textContent = '儲存失敗：' + error.message; return; }
    if (autoFilled) msg.textContent = '已自動填入時間／場地並儲存 ✓';
    // realtime subscription will refresh the grid for everyone (incl. us)
  } else {
    if (id) {
      const i = events.findIndex(e => e.id === id);
      if (i >= 0) events[i] = payload;
    } else {
      events.push(payload);
    }
    await persist();
    renderGrid();
  }
  closeModal();
}

async function deleteEvent(id) {
  if (!confirm('確定要刪除此採訪項目嗎？')) return;
  if (HAS_SUPABASE_CFG) {
    const { error } = await sb.from(SUPABASE_TABLE).delete().eq('id', id);
    if (error) { document.getElementById('statusMsg').textContent = '刪除失敗：' + error.message; return; }
  } else {
    events = events.filter(e => e.id !== id);
    await persist();
    renderGrid();
  }
}

async function persist() {
  const msg = document.getElementById('statusMsg');
  const ok = await storageSet(STORAGE_KEY, JSON.stringify(events));
  if (ok) {
    msg.textContent = HAS_CLAUDE_STORAGE ? '已儲存並同步給所有同事 ✓' : '已儲存在此瀏覽器（僅此裝置可見）✓';
    setTimeout(() => { if (msg.textContent.indexOf('已') === 0) msg.textContent=''; }, 2500);
  } else {
    msg.textContent = '儲存失敗，變更只保留在此頁面（重新整理後或會消失）';
  }
}

async function syncMissing() {
  const msg = document.getElementById('statusMsg');
  const targets = events.filter(e => !e.time || !e.venue);
  if (targets.length === 0) { msg.textContent = '所有項目都已有時間及場地，沒有需要同步的項目'; return; }
  msg.style.color = 'var(--muted)';
  msg.textContent = `正在同步 ${targets.length} 項缺漏資料...`;

  const updated = [];
  targets.forEach(e => {
    const match = findScheduleMatch(e.date, e.discipline, e.event);
    if (!match) return;
    const newTime = e.time || match.time;
    const newVenue = e.venue || match.venue;
    if (newTime !== e.time || newVenue !== e.venue) {
      e.time = newTime;
      e.venue = newVenue;
      updated.push(e);
    }
  });

  if (updated.length === 0) {
    msg.textContent = `已檢查 ${targets.length} 項缺漏資料，但找不到可靠的對應場次（可能項目名稱與官方賽程用字差異太大）`;
    return;
  }

  if (HAS_SUPABASE_CFG) {
    const { error } = await sb.from(SUPABASE_TABLE).upsert(updated.map(toDbRow), { onConflict: 'id' });
    if (error) { msg.textContent = '同步失敗：' + error.message; return; }
  } else {
    await persist();
  }
  renderGrid();
  msg.style.color = '#1E8E4E';
  msg.textContent = `已為 ${updated.length} 項自動填入時間／場地 ✓`;
}

async function resetAll() {
  if (!confirm('確定要清除所有人手修改，回復至原始名單嗎？此操作會影響所有同事看到的版本。')) return;
  if (HAS_SUPABASE_CFG) {
    const msg = document.getElementById('statusMsg');
    msg.textContent = '正在重設，請稍候…';
    const { error: delErr } = await sb.from(SUPABASE_TABLE).delete().neq('id', '__never__');
    if (delErr) { msg.textContent = '重設失敗：' + delErr.message; return; }
    const { error: insErr } = await sb.from(SUPABASE_TABLE).insert(BASE_EVENTS.map(toDbRow));
    if (insErr) { msg.textContent = '重設失敗：' + insErr.message; return; }
    msg.textContent = '已重設 ✓';
  } else {
    events = JSON.parse(JSON.stringify(BASE_EVENTS));
    await persist();
    renderGrid();
  }
}

async function loadFromSupabase() {
  const { data, error } = await sb.from(SUPABASE_TABLE).select('*').order('date').order('time');
  if (error) {
    document.getElementById('statusMsg').textContent = '讀取失敗：' + error.message;
    return null;
  }
  return data.map(r => ({
    id: r.id, date: r.date, time: r.time || '', discipline: r.discipline,
    event: r.event, athletes: r.athletes || '', venue: r.venue || '',
    people: Array.isArray(r.people) ? r.people : [],
  }));
}

async function seedSupabaseIfEmpty() {
  const { count, error } = await sb.from(SUPABASE_TABLE).select('*', { count: 'exact', head: true });
  if (error) return false;
  if (count === 0) {
    const { error: insErr } = await sb.from(SUPABASE_TABLE).insert(BASE_EVENTS.map(toDbRow));
    if (insErr) {
      document.getElementById('statusMsg').textContent = '初始化資料表失敗：' + insErr.message;
      return false;
    }
    return true;
  }
  return true;
}

function subscribeSupabaseRealtime() {
  sb.channel('calendar_events_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: SUPABASE_TABLE }, async () => {
      const data = await loadFromSupabase();
      if (data) { events = data; renderGrid(); }
    })
    .subscribe();
}

async function init() {
  renderLegend();

  if (HAS_SUPABASE_CFG) {
    setConnPill('supabase');
    await seedSupabaseIfEmpty();
    const data = await loadFromSupabase();
    events = data || JSON.parse(JSON.stringify(BASE_EVENTS));
    subscribeSupabaseRealtime();
  } else {
    setConnPill(HAS_CLAUDE_STORAGE ? 'claude' : 'local');
    const res = await storageGet(STORAGE_KEY);
    try {
      events = res && res.value ? JSON.parse(res.value) : JSON.parse(JSON.stringify(BASE_EVENTS));
    } catch (err) {
      events = JSON.parse(JSON.stringify(BASE_EVENTS));
    }
  }
    renderGrid();
  runExternalSync(false);
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

init();
</script>
