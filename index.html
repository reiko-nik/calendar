function toDbRow(e) {
  return {
    id: e.id, date: e.date, time: e.time || '', discipline: e.discipline,
    event: e.event, athletes: e.athletes || '', venue: e.venue || '',
    people: e.people || [],
  };
}

async function storageGet(key) {
  if (HAS_CLAUDE_STORAGE) {
    try { return await window.storage.get(key, true); }
    catch (err) { /* fall through to localStorage */ }
  }
  try {
    const v = window.localStorage.getItem(key);
    return v ? { value: v } : null;
  } catch (err) { return null; }
}
async function storageSet(key, value) {
  if (HAS_CLAUDE_STORAGE) {
    try { await window.storage.set(key, value, true); return true; }
    catch (err) { /* fall through to localStorage */ }
  }
  try { window.localStorage.setItem(key, value); return true; }
  catch (err) { return false; }
}

function fmtDayLabel(iso) {
  const d = new Date(iso + 'T00:00:00');
  const m = d.getMonth() + 1, day = d.getDate();
  const showMonth = (day === 1) || (iso === DAYS[0]);
  const isMonthStart = (day === 1);
  return { m, day, showMonth, isMonthStart };
}

    addBtn.onclick = () => openModal(iso);
    cell.appendChild(addBtn);

    grid.appendChild(cell);
  });
}

function renderEventCard(e) {
  const div = document.createElement('div');
  div.className = 'ev';
  const colors = e.people.map(personColor);
  if (colors.length === 1) {
    div.style.borderLeftColor = colors[0];
  } else {
    div.style.borderImage = `linear-gradient(${colors.join(',')}) 1`;
    div.style.borderLeftWidth = '4px';
    div.style.borderLeftStyle = 'solid';
  }
  const who = e.people.map(p => PEOPLE[p] ? PEOPLE[p].label_zh.replace(/（.*）/, '') : p).join(' / ');
  const athleteBit = e.athletes ? `　${e.athletes}` : '';
  div.innerHTML = `<span class="t">${e.time || ''}</span>${e.discipline} － ${e.event}${athleteBit}<span class="who">${who}${e.venue ? '　·　' + e.venue : ''}</span>
    <button class="del" title="刪除">×</button>`;
  div.title = `${e.discipline} ${e.event}\n${e.venue || ''}`;
  div.addEventListener('click', () => openModal(e.date, e));
  div.querySelector('.del').onclick = (ev) => { ev.stopPropagation(); deleteEvent(e.id); };
  return div;
}

function openModal(iso, existing) {
  document.getElementById('modalTitle').textContent = existing ? '編輯採訪項目' : '新增採訪項目';
  document.getElementById('editId').value = existing ? existing.id : '';
  document.getElementById('fDate').value = iso;
  document.getElementById('fTime').value = existing ? existing.time : '';
  document.getElementById('fDiscipline').value = existing ? existing.discipline : '';
  document.getElementById('fEvent').value = existing ? existing.event : '';
  document.getElementById('fAthletes').value = existing ? existing.athletes : '';
  const pc = document.getElementById('peopleCheck');
  pc.innerHTML = Object.keys(PEOPLE).map(p => {
    const checked = existing && existing.people.includes(p) ? 'checked' : '';
    return `<label><input type="checkbox" value="${p}" ${checked}> <span style="color:${PEOPLE[p].color}">●</span> ${p}</label>`;
  }).join('');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlay').dataset.date = iso;
}
function closeModal() { document.getElementById('overlay').classList.remove('show'); }

async function saveModal() {
  const iso = document.getElementById('fDate').value;
  const id = document.getElementById('editId').value;
  const people = Array.from(document.querySelectorAll('#peopleCheck input:checked')).map(i => i.value);
  if (people.length === 0) { alert('請至少選擇一位負責同事'); return; }
  const payload = {
    id: id || (HAS_SUPABASE_CFG ? crypto.randomUUID() : ('u' + (seq++))),
    date: iso,
    time: document.getElementById('fTime').value.trim(),
    discipline: document.getElementById('fDiscipline').value.trim() || '（未命名項目）',
    event: document.getElementById('fEvent').value.trim(),
    athletes: document.getElementById('fAthletes').value.trim(),
    venue: '',
    people,
  };

  if (HAS_SUPABASE_CFG) {
    const msg = document.getElementById('statusMsg');
    const { error } = await sb.from(SUPABASE_TABLE).upsert(toDbRow(payload), { onConflict: 'id' });
    if (error) { msg.textContent = '儲存失敗：' + error.message; return; }
    // realtime subscription will refresh the grid for everyone (incl. us)
  } else {
    if (id) {
      const i = events.findIndex(e => e.id === id);
      if (i >= 0) events[i] = payload;
    } else {
      events.push(payload);
    }
    await persist();
    renderGrid();
  }
  closeModal();
}

async function deleteEvent(id) {
  if (!confirm('確定要刪除此採訪項目嗎？')) return;
  if (HAS_SUPABASE_CFG) {
    const { error } = await sb.from(SUPABASE_TABLE).delete().eq('id', id);
    if (error) { document.getElementById('statusMsg').textContent = '刪除失敗：' + error.message; return; }
  } else {
    events = events.filter(e => e.id !== id);
    await persist();
    renderGrid();
  }
}

async function persist() {
  const msg = document.getElementById('statusMsg');
  const ok = await storageSet(STORAGE_KEY, JSON.stringify(events));
  if (ok) {
    msg.textContent = HAS_CLAUDE_STORAGE ? '已儲存並同步給所有同事 ✓' : '已儲存在此瀏覽器（僅此裝置可見）✓';
    setTimeout(() => { if (msg.textContent.indexOf('已') === 0) msg.textContent=''; }, 2500);
  } else {
    msg.textContent = '儲存失敗，變更只保留在此頁面（重新整理後或會消失）';
  }
}

async function resetAll() {
  if (!confirm('確定要清除所有人手修改，回復至原始名單嗎？此操作會影響所有同事看到的版本。')) return;
  if (HAS_SUPABASE_CFG) {
    const msg = document.getElementById('statusMsg');
    msg.textContent = '正在重設，請稍候…';
    const { error: delErr } = await sb.from(SUPABASE_TABLE).delete().neq('id', '__never__');
    if (delErr) { msg.textContent = '重設失敗：' + delErr.message; return; }
    const { error: insErr } = await sb.from(SUPABASE_TABLE).insert(BASE_EVENTS.map(toDbRow));
    if (insErr) { msg.textContent = '重設失敗：' + insErr.message; return; }
    msg.textContent = '已重設 ✓';
  } else {
    events = JSON.parse(JSON.stringify(BASE_EVENTS));
    await persist();
    renderGrid();
  }
}

async function loadFromSupabase() {
  const { data, error } = await sb.from(SUPABASE_TABLE).select('*').order('date').order('time');
  if (error) {
    document.getElementById('statusMsg').textContent = '讀取失敗：' + error.message;
    return null;
  }
  return data.map(r => ({
    id: r.id, date: r.date, time: r.time || '', discipline: r.discipline,
    event: r.event, athletes: r.athletes || '', venue: r.venue || '',
    people: Array.isArray(r.people) ? r.people : [],
  }));
}

async function seedSupabaseIfEmpty() {
  const { count, error } = await sb.from(SUPABASE_TABLE).select('*', { count: 'exact', head: true });
  if (error) return false;
  if (count === 0) {
    const { error: insErr } = await sb.from(SUPABASE_TABLE).insert(BASE_EVENTS.map(toDbRow));
    if (insErr) {
      document.getElementById('statusMsg').textContent = '初始化資料表失敗：' + insErr.message;
      return false;
    }
    return true;
  }
  return true;
}

function subscribeSupabaseRealtime() {
  sb.channel('calendar_events_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: SUPABASE_TABLE }, async () => {
      const data = await loadFromSupabase();
      if (data) { events = data; renderGrid(); }
    })
    .subscribe();
}

async function init() {
  renderLegend();

  if (HAS_SUPABASE_CFG) {
    setConnPill('supabase');
    await seedSupabaseIfEmpty();
    const data = await loadFromSupabase();
    events = data || JSON.parse(JSON.stringify(BASE_EVENTS));
    subscribeSupabaseRealtime();
  } else {
    setConnPill(HAS_CLAUDE_STORAGE ? 'claude' : 'local');
    const res = await storageGet(STORAGE_KEY);
    try {
      events = res && res.value ? JSON.parse(res.value) : JSON.parse(JSON.stringify(BASE_EVENTS));
    } catch (err) {
      events = JSON.parse(JSON.stringify(BASE_EVENTS));
    }
  }
  renderGrid();
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

init();
</script>
</body>
